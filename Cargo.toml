[package]
name = "tetractl"
version = "0.0.1"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "World command for the Hedronite platform. Nickel is the language; tetractl wraps Facet/Hedron/kubectl as they are."
repository = "https://github.com/VirtualMachinist/tetra-cli"
homepage = "https://github.com/VirtualMachinist/tetra-cli"
readme = "README.md"
keywords = ["hedronite", "nickel", "cli"]
categories = ["command-line-utilities"]
publish = true

[lib]
name = "tetractl"
path = "src/lib.rs"

[[bin]]
name = "tetractl"
path = "src/main.rs"

[[bin]]
name = "tetra"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"
